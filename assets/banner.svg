<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cubeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -20px); opacity: 0.6; }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(3deg); }
    }
    @keyframes floatCubeSmall {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-4deg); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    .orb-anim {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .cube-anim {
      animation: floatCube 6s ease-in-out infinite;
      transform-origin: center;
    }
    .cube-anim-2 {
      animation: floatCubeSmall 5s ease-in-out infinite;
      transform-origin: center;
    }
    .grid-lines {
      stroke-dasharray: 6 6;
      animation: dashCycle 20s linear infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <g class="orb-anim">
    <circle cx="200" cy="120" r="160" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
    <circle cx="1020" cy="220" r="190" fill="#ec4899" filter="url(#glow)" opacity="0.25" />
    <circle cx="600" cy="360" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Isometric Perspective Grid Background (Behind Text) -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1" class="grid-lines">
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="310" x2="1200" y2="310" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="410" x2="1200" y2="410" />
    
    <line x1="100" y1="420" x2="450" y2="180" />
    <line x1="250" y1="420" x2="550" y2="180" />
    <line x1="400" y1="420" x2="650" y2="180" />
    <line x1="550" y1="420" x2="750" y2="180" />
    <line x1="700" y1="420" x2="850" y2="180" />
    <line x1="850" y1="420" x2="950" y2="180" />
    <line x1="1000" y1="420" x2="1050" y2="180" />
    <line x1="1150" y1="420" x2="1150" y2="180" />
  </g>

  <!-- Floating Dynamic 3D Isometric Elements on Sides (Not covering foreground center) -->
  <!-- Left Side Cube Wireframe & Shaded Faces -->
  <g class="cube-anim" transform="translate(110, 160)">
    <!-- Top Face -->
    <polygon points="0,-45 40,-65 80,-45 40,-25" fill="url(#cubeGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="0,-45 40,-25 40,25 0,5" fill="url(#cubeGrad2)" stroke="#818cf8" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="40,-25 80,-45 80,5 40,25" fill="url(#cubeGrad3)" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Right Side Cube Wireframe & Shaded Faces -->
  <g class="cube-anim-2" transform="translate(1010, 140)">
    <!-- Top Face -->
    <polygon points="0,-35 35,-52 70,-35 35,-18" fill="url(#cubeGrad3)" stroke="#c084fc" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="0,-35 35,-18 35,22 0,5" fill="url(#cubeGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="35,-18 70,-35 70,5 35,22" fill="url(#cubeGrad2)" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- High-Z Foreground Text & Highlights (Always Centered and Crisp) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Tag / Top Badge -->
    <g transform="translate(600, 78)">
      <rect x="-145" y="-18" width="290" height="34" rx="17" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5" filter="url(#pillGlow)" opacity="0.9" />
      <text y="4" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="2">⚡ CURATED ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="1">
      Awesome 3D Mockup Software
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="215" font-size="20" font-weight="500" fill="#e2e8f0" opacity="0.95">
      Real-Time Rendering, Scene Staging &amp; Self-Hosted 3D Design Platforms
    </text>

    <text x="600" y="250" font-size="14" font-weight="400" fill="#94a3b8">
      SaaS Market Leaders • Open-Source Powerhouses • Packaging &amp; Product Visualization
    </text>

    <!-- Feature Pills / Highlights in Foreground -->
    <g transform="translate(600, 310)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text y="5" font-size="12" font-weight="600" fill="#7dd3fc">🎨 Scene Staging</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <text y="5" font-size="12" font-weight="600" fill="#a5b4fc">⚡ Real-Time Render</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
        <text y="5" font-size="12" font-weight="600" fill="#e9d5ff">📦 Packaging 3D</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(270, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
        <text y="5" font-size="12" font-weight="600" fill="#6ee7b7">🌐 Browser WebGL</text>
      </g>
    </g>

    <!-- Bottom border subtle glow line -->
    <line x1="300" y1="365" x2="900" y2="365" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
